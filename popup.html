<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Focus Buddy</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="titlebar">
    <span>🌸 focus-buddy</span>
    <span class="streak-badge">🔥 <b id="streak">0</b></span>
  </div>

  <div class="pad">
    <div class="buddy" id="buddy"></div>

    <!-- IDLE view -->
    <div id="idle">
      <div id="notes-recap" class="notes-recap hidden">
        <div class="notes-recap-head">
          <span>📝 notes from your last session</span>
          <button id="notes-clear" class="notes-clear">clear</button>
        </div>
        <ul id="notes-list" class="notes-list"></ul>
      </div>

      <label class="lbl" for="goal">what are you focusing on?</label>
      <input id="goal" class="field" type="text" placeholder="e.g. finish the chapter outline" maxlength="80" />

      <label class="lbl">for how long?</label>
      <div class="durations" id="durations">
        <button class="dur" data-min="25">25m</button>
        <button class="dur active" data-min="50">50m</button>
        <button class="dur" data-min="90">90m</button>
      </div>

      <label class="lbl" for="distract">distracted by website</label>
      <p class="focus-note">Things you get distracted by. One site per line. Leave this empty if you only want a timer.</p>
      <textarea id="distract" class="field area" rows="4" placeholder="instagram.com&#10;linkedin.com" spellcheck="false">instagram.com
linkedin.com</textarea>

      <details class="more">
        <summary>options</summary>
        <label class="lbl" for="key">claude fable 5 api key (optional — fresh pep talks)</label>
        <input id="key" class="field" type="password" placeholder="sk-ant-... (stays on your device)" />
      </details>

      <button id="start" class="cta">start focusing →</button>
    </div>

    <!-- ACTIVE view -->
    <div id="active" class="hidden">
      <p class="active-goal">focusing on:<br /><b id="active-goal-text"></b></p>
      <p class="countdown" id="countdown">--:--</p>
      <p class="focus-note" id="blocked-note"></p>
      <button id="end" class="cta danger">end session</button>
    </div>
  </div>

  <script src="character.js"></script>
  <script src="popup.js"></script>
</body>
</html>
